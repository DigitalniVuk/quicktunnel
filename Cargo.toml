[package]
name = "quicktunnel"
version = "0.1.0"
edition = "2024"
description = "Simple cross-platform Cloudflare Quick Tunnel desktop app"
license = "GPL-3.0-or-later"
repository = "https://github.com/DigitalniVuk/quicktunnel"
homepage = "https://github.com/DigitalniVuk/quicktunnel"
authors = ["DigitalniVuk"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
dirs = "6"
ureq = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
